<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { font: 700 46px Consolas, monospace; fill: #9fb3d1; }
      .tagline { font: 400 20px Consolas, monospace; fill: #6b7a99; }
      .cursor { fill: #9fb3d1; }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="#0d1117"/>

  <text x="50" y="95" class="name">Merjem Alić</text>

  <text x="50" y="140" class="tagline">
    <tspan>Software Engineering Student · Low-Level Systems</tspan>
  </text>

  <g>
    <text x="50" y="175" font-family="Consolas, monospace" font-size="16" fill="#7f93b8">
      building things close to the metal, one segfault at a time
    </text>
    <rect class="cursor" x="565" y="162" width="9" height="18">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
